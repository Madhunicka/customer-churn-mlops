name: CI - Continuous Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint source code
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity and line length
          flake8 src app tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Train Baseline Model Artifact
        run: |
          python -m src.churn.train --model-type logistic

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --junitxml=test-reports/junit.xml

      - name: Build Docker Container
        run: |
          docker build -t customer-churn-mlops:${{ github.sha }} .

      - name: Test Docker Container Health
        run: |
          docker run -d -p 8000:8000 --name churn-test-app customer-churn-mlops:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health || exit 1
          docker stop churn-test-app
